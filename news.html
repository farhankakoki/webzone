  <!-- ===== NEWS & EVENTS ===== -->
  <section class="section news-section" id="news">
    <div class="container">
      <div class="section-header">
        <div class="section-badge" data-i18n="news_badge">Latest Updates</div>
        <h2 class="section-title" data-i18n="news_title">News & Events</h2>
        <p class="section-desc" data-i18n="news_desc">Stay updated with the latest service announcements and events</p>
        <div class="scroll-hint"><i class="fa-solid fa-arrows-left-right"></i> Swipe to view more</div>
      </div>
      <div class="news-grid reveal-stagger" id="newsGrid" data-reveal="fade-up">
        <div class="news-loading">
          <div class="spinner"></div>
          <p data-i18n="news_loading">Fetching latest news...</p>
        </div>
      </div>
    </div>
  </section>
